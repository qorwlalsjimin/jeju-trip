<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>겨울이 머문 제주</title>
<meta name="description" content="제주 식당·카페·놀거리, 여행 일정">

<!-- 카카오톡 링크 미리보기(썸네일) -->
<meta property="og:type" content="website">
<meta property="og:title" content="겨울이 머문 제주 . . . ✈ 여행 플래너">
<meta property="og:description" content="가고 싶은 식당·카페·놀거리를 업로드해주세요">
<meta property="og:image" content="https://qorwlalsjimin.github.io/jeju-trip/og-image.png">
<meta property="og:url" content="https://qorwlalsjimin.github.io/jeju-trip/">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#FFB591">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
/* Layout: 지도가 주인공 — 데스크톱은 지도 | 목록 2단, 모바일은 지도 위·목록 아래. 항공권은 탑승권 카드. */
:root{
  --bg:#FBF7F3; --surface:#FFFFFF; --sunken:#F4EEF1;
  --ink:#45404D; --muted:#8E8796; --line:#EFE7EC;
  --accent:#FFB591; --accent-ink:#5C2E16; --accent-soft:#FFEDE2; --accent-strong:#D96B34;
  --food:#F9CCDA; --food-ink:#8A3A55;
  --cafe:#FFF7C9; --cafe-ink:#6B5410;
  --fun:#CFFFFC;  --fun-ink:#22605B;
  --stay:#DCD0F7; --stay-ink:#4A3B7A; --stay-soft:#F1ECFC;
  --danger:#D9675A;
  --shadow:0 8px 28px rgba(69,64,77,.12);
  --f-display:"Gowun Batang", "Noto Serif KR", serif;
  --f-body:"Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1F1C24; --surface:#28242E; --sunken:#312C38;
    --ink:#F2EDF4; --muted:#A8A1B0; --line:#3A3442;
    --accent:#FFB591; --accent-ink:#4A2412; --accent-soft:#45302A; --accent-strong:#FFB591;
    --food:#F4BFD0; --food-ink:#6E2A42;
    --cafe:#FFF7C9; --cafe-ink:#5C470B;
    --fun:#CFFFFC;  --fun-ink:#1C504C;
    --stay:#CFC2F2; --stay-ink:#3B2F66; --stay-soft:#2F2A40;
    --danger:#F09A8F;
    --shadow:0 8px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
a{color:inherit}

/* ── header ── */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px 10px;padding-top:max(14px, env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand h1 i{font-style:normal;color:var(--accent-strong)}
.brand small{color:var(--muted);font-size:13px;white-space:nowrap}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flight-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--sunken);font-size:13px;border:0;font-variant-numeric:tabular-nums}
.flight-chip b{color:var(--accent-strong)}
.me-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.avatar{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700}

.tabs{display:flex;gap:4px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}

.banner{margin:0;padding:8px 16px;font-size:13px;background:var(--accent-soft);color:var(--ink)}

/* ── map view ── */
.map-view{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:calc(var(--screen-h, 100vh) - var(--chrome, 120px))}
.map-wrap{position:relative;height:100%;min-height:300px}
#map{height:100%;background:var(--sunken)}
.home-btn{position:absolute;top:10px;left:10px;z-index:5;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.home-btn svg{width:14px;height:14px;flex:none}
.side{display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line);background:var(--surface);overflow:hidden;position:relative}
.side-head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.fchip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.fchip .sw{width:8px;height:8px;border-radius:50%}
.side-tools{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sort{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:16px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--sunken)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}

.list{list-style:none;margin:0;padding:6px 0 90px;overflow:auto;flex:1}
.place{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 12px}
.place.active{background:var(--sunken)}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;grid-row:span 2}
.c-food{background:var(--food);color:var(--food-ink)} .c-cafe{background:var(--cafe);color:var(--cafe-ink)} .c-fun{background:var(--fun);color:var(--fun-ink)} .c-stay{background:var(--stay);color:var(--stay-ink)}
.place-main{border:0;background:none;padding:0;text-align:left;min-width:0}
.place-main strong{display:block;font-size:15px}
.place-main .addr{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place-main .memo{margin:4px 0 0;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.place-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.like{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.like.on{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft)}
.textbtn{border:0;background:none;padding:0;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.textbtn.danger{color:var(--danger)}
.place-meta a{text-underline-offset:2px}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.fab{position:absolute;right:16px;bottom:16px;z-index:5;box-shadow:var(--shadow);padding:12px 18px;border-radius:999px}

/* ── form sheet ── */
.sheet{position:absolute;inset:0;background:var(--surface);z-index:10;display:flex;flex-direction:column}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:17px}
.sheet-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;padding-bottom:max(12px, env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);font-size:16px}
textarea.input{min-height:72px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:flex;justify-content:center;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:9px;font-weight:600}
.seg span{color:var(--muted)}
.seg input:checked+span{background:var(--c);border-color:var(--c);color:var(--ci)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.seg .food{--c:var(--food);--ci:var(--food-ink)} .seg .cafe{--c:var(--cafe);--ci:var(--cafe-ink)} .seg .fun{--c:var(--fun);--ci:var(--fun-ink)}
.row{display:flex;gap:6px}
.row .input{flex:1;min-width:0}
.results{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.results li+li{border-top:1px solid var(--line)}
.results button{width:100%;text-align:left;border:0;background:var(--surface);padding:8px 12px;font-size:13.5px}
.results button small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results button:hover{background:var(--sunken)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.loc{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--sunken);font-variant-numeric:tabular-nums}
.loc.set{background:var(--accent-soft)}
.err{color:var(--danger);font-size:13px;margin:0}

/* ── map pins ── */
.pin{padding:0;cursor:pointer;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(40,30,50,.38)}
.pin span{transform:rotate(45deg);color:inherit;font:700 12px var(--f-body)}
.pin.temp{background:var(--ink);color:var(--bg);animation:bob .9s ease-in-out infinite alternate}
.pin.sel{outline:3px solid var(--ink);outline-offset:1px}
@keyframes bob{to{translate:0 -4px}}
@media (prefers-reduced-motion: reduce){.pin.temp{animation:none}}
.info-wrap{padding-bottom:44px}
.info{position:relative;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 32px 12px 14px;width:240px;white-space:normal}
.info::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.info-x{position:absolute;top:6px;right:6px;border:0;background:none;font-size:18px;line-height:1;padding:4px 6px;color:var(--muted)}
.pop strong{font-size:14px;display:block}
.pop .meta{color:var(--muted);font-size:12px}
.pop p{margin:6px 0;white-space:pre-wrap;font-size:13px}
.pop .links{display:flex;gap:10px;font-size:12.5px;margin-top:6px}
.pop .links a{color:var(--accent-strong);text-underline-offset:2px}
.map-msg{height:100%;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-size:14px}
.map-msg b{display:block;color:var(--ink);margin-bottom:4px}

/* ── flights ── */
.flights{max-width:880px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:20px}
.flights-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.flights-head h2{font-family:var(--f-display);font-size:26px;margin:0}
.flights-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.passes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.pass{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pass-top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--accent-soft);color:var(--ink);font-size:13px;letter-spacing:.04em}
.pass-top b{font-size:14px;letter-spacing:.06em}
.pass-route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:20px 18px 14px}
.port{min-width:0}
.port .city{font-family:var(--f-display);font-size:28px;line-height:1.1;display:block}
.port time{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.port.to{text-align:right}
.plane{color:var(--accent-strong);font-size:20px}
.pass-cut{border-top:2px dashed var(--line);margin:0 14px;position:relative}
.pass-cut::before,.pass-cut::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.pass-cut::before{left:-25px}.pass-cut::after{right:-25px}
.pass-foot{display:flex;justify-content:space-between;gap:12px;padding:12px 18px 16px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pass-foot b{color:var(--ink);font-weight:600}
.pass.blank .pass-route{color:var(--muted)}
.stay{display:flex;gap:24px;flex-wrap:wrap;padding:16px 18px;border-radius:16px;background:var(--accent-soft)}
.stay div{display:flex;flex-direction:column}
.stay small{font-size:12px;color:var(--muted);letter-spacing:.04em}
.stay b{font-size:20px;font-variant-numeric:tabular-nums}
.ffoot{font-size:13px;color:var(--muted)}
.fform{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:18px}
.fform fieldset{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fform legend{font-weight:700;margin-bottom:8px;font-size:15px}
.fform-foot{display:flex;justify-content:flex-end;gap:8px}

/* ── tabs: 4개라 좁은 화면에서 가로 스크롤 ── */
.tabs{overflow-x:auto;scrollbar-width:none}
.tab{white-space:nowrap}

/* ── stay ── */
.stay-wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:20px}
.stay-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stay-top{display:flex;align-items:center;gap:12px;padding:16px 18px;background:var(--stay-soft)}
.stay-top .dot{grid-row:auto}
.stay-top h3{margin:0;font-family:var(--f-display);font-size:24px;line-height:1.2}
.stay-top small{display:block;color:var(--muted);font-size:13px}
.stay-times{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:18px}
.stay-times div{display:flex;flex-direction:column;min-width:0}
.stay-times small{font-size:12px;color:var(--muted);letter-spacing:.04em}
.stay-times b{font-size:17px;font-variant-numeric:tabular-nums}
.stay-times .to{text-align:right}
.nights{padding:4px 12px;border-radius:999px;background:var(--stay);color:var(--stay-ink);font-size:13px;font-weight:700;white-space:nowrap}
.stay-foot{display:flex;flex-wrap:wrap;gap:8px 14px;padding:12px 18px 16px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--muted)}
.stay-foot a{color:var(--accent-strong);text-underline-offset:2px}
.stay-memo{margin:0;padding:0 18px 16px;white-space:pre-wrap;font-size:14px}

/* ── plan ── */
.plan-wrap{max-width:880px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:14px}
.day-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.day-tab{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;text-align:left;white-space:nowrap;flex:none}
.day-tab b{display:block;font-size:14px}
.day-tab small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.day-tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day-tab[aria-pressed="true"] small{color:inherit;opacity:.75}
.timeline{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tl-times{border-right:1px solid var(--line)}
.tl-time{height:var(--row);font-size:12px;color:var(--muted);text-align:right;padding:4px 8px 0 0;font-variant-numeric:tabular-nums;box-sizing:border-box}
.tl-time.half{color:transparent}
.tl-body{position:relative}
.tl-slot{display:block;width:100%;height:var(--row);border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:0 10px;color:transparent;font-size:12.5px}
.tl-slot:first-child{border-top:0}
.tl-slot.hour{border-top-color:var(--line)}
.tl-slot.half{border-top-style:dashed}
.tl-slot:hover,.tl-slot:focus-visible{background:var(--sunken);color:var(--muted)}
.tl-item{position:absolute;box-sizing:border-box;border-radius:10px;padding:6px 10px;border:0;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:1px;font-size:13px;line-height:1.3;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.tl-item b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-item small{font-size:11.5px;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-item.c-free{background:var(--sunken);color:var(--ink)}
.tl-item.fixed{flex-direction:row;align-items:center;gap:8px;padding:0 10px;background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 6px,var(--sunken) 6px,var(--sunken) 12px);color:var(--ink);border:1px dashed var(--muted);cursor:default}
.plan-empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:40px 24px;text-align:center;color:var(--muted)}
.plan-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.plan-empty .btn{margin-top:14px}

/* ── modal ── */
.modal{position:fixed;inset:0;z-index:1500;background:rgba(31,28,36,.45);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--surface);border-radius:18px;width:100%;max-width:460px;max-height:calc(var(--screen-h, 100vh) - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal-card .sheet-body{flex:1;min-height:0}
.pick-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;max-height:240px;overflow:auto}
.pick-list li+li{border-top:1px solid var(--line)}
.pick-list label{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer}
.pick-list input{accent-color:var(--accent-strong)}
.pick-list .dot{width:26px;height:26px;font-size:11.5px;flex:none}
.pick-list span.t{min-width:0}
.pick-list span.t b{display:block;font-size:14px;font-weight:600}
.pick-list span.t small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-list .none{padding:16px;color:var(--muted);font-size:13.5px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg2 label{position:relative}
.seg2 input{position:absolute;opacity:0}
.seg2 span{display:flex;justify-content:center;border:1px solid var(--line);border-radius:10px;padding:8px;font-weight:600;color:var(--muted)}
.seg2 input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg2 input:focus-visible+span{outline:2px solid var(--accent)}
.btn.danger{background:none;border:1px solid var(--line);color:var(--danger);margin-right:auto}
@media (max-width: 820px){
  .modal{place-items:end center;padding:0}
  .modal-card{max-width:none;border-radius:18px 18px 0 0;max-height:calc(var(--screen-h, 100vh) * .85)}
}

/* ── who-are-you ── */
.who{position:fixed;inset:0;z-index:2000;background:rgba(18,23,21,.55);display:grid;place-items:center;padding:16px}
.who-card{background:var(--surface);border-radius:20px;padding:24px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.who-card h2{font-family:var(--f-display);margin:0 0 4px;font-size:24px}
.who-card p{margin:0 0 16px;color:var(--muted)}
.who-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.who-grid button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-weight:600;font-size:15px}
.who-grid button.me{border-color:var(--accent);background:var(--accent-soft)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:3000;box-shadow:var(--shadow)}

/* ── mobile ── */
@media (max-width: 820px){
  .map-view{display:block;height:auto}
  .map-wrap{height:calc(var(--screen-h, 100vh) * .46);min-height:240px;position:sticky;top:0;z-index:1}
  .side{border-left:0;overflow:visible}
  .list{overflow:visible;padding-bottom:96px}
  .fab{position:fixed;bottom:max(16px, env(safe-area-inset-bottom))}
  .sheet{position:fixed;top:auto;max-height:calc(var(--screen-h, 100vh) * .58);border-radius:18px 18px 0 0;box-shadow:var(--shadow)}
  .brand h1{font-size:21px}
  .top-right{margin-left:0;width:100%}
}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="brand">
    <h1>겨울이 머문 <i>제주</i></h1>
    <small id="summary">8명 · 장소 0곳</small>
  </div>
  <div class="top-right">
    <button class="flight-chip" id="flightChip" type="button">항공편 미등록</button>
    <button class="me-chip" id="meChip" type="button"><span class="avatar" id="meAvatar">?</span><span id="meName">이름 선택</span></button>
  </div>
</header>
<nav class="tabs" role="tablist">
  <button class="tab" role="tab" id="tabMap" aria-selected="true" type="button">지도 · 장소</button>
  <button class="tab" role="tab" id="tabPlan" aria-selected="false" type="button">계획표</button>
  <button class="tab" role="tab" id="tabStay" aria-selected="false" type="button">숙소</button>
  <button class="tab" role="tab" id="tabFlights" aria-selected="false" type="button">항공권</button>
</nav>
<p class="banner" id="demoBanner" hidden>미리보기 모드: Firebase가 아직 연결되지 않아 등록한 내용이 이 기기에만 저장됩니다.</p>

<main>
  <section class="map-view" id="viewMap">
    <div class="map-wrap">
      <div id="map" aria-label="제주 지도"></div>
      <button type="button" class="home-btn" id="homeBtn" aria-label="제주 전체 보기"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7.2 8 2.5l6 4.7"/><path d="M3.8 6v7.2h8.4V6"/></svg>제주 전체</button>
    </div>
    <aside class="side">
      <div class="side-head">
        <div class="filters" id="filters"></div>
        <div class="side-tools">
          <span class="hint" id="listCount"></span>
          <select class="sort" id="sort" aria-label="정렬">
            <option value="new">최근 등록순</option>
            <option value="like">가고 싶어요 많은 순</option>
          </select>
        </div>
      </div>
      <ul class="list" id="list"></ul>
      <button class="btn primary fab" id="addBtn" type="button">+ 장소 추가</button>

      <form class="sheet" id="sheet" hidden novalidate>
        <div class="sheet-head">
          <h2 id="sheetTitle">장소 추가</h2>
          <button class="btn small ghost" type="button" id="sheetClose">닫기</button>
        </div>
        <div class="sheet-body">
          <div class="field">
            <span class="lbl">종류</span>
            <div class="seg">
              <label><input type="radio" name="cat" value="food" id="catFood" checked><span class="food">식당</span></label>
              <label><input type="radio" name="cat" value="cafe" id="catCafe"><span class="cafe">카페</span></label>
              <label><input type="radio" name="cat" value="fun" id="catFun"><span class="fun">유원지</span></label>
            </div>
          </div>
          <div class="field">
            <label for="fName">이름</label>
            <input class="input" id="fName" maxlength="60" placeholder="예: 우진해장국" autocomplete="off">
          </div>
          <div class="field">
            <label for="fSearch">위치</label>
            <div class="row">
              <input class="input" id="fSearch" placeholder="카카오맵에서 장소명·주소 검색" autocomplete="off">
              <button class="btn small" type="button" id="searchBtn">검색</button>
            </div>
            <ul class="results" id="results" hidden></ul>
            <p class="hint">검색 결과가 없으면 <b>지도를 눌러</b> 위치를 찍어주세요. 다시 누르면 핀이 옮겨져요.</p>
            <div class="loc" id="locBox">위치를 아직 정하지 않았어요</div>
          </div>
          <div class="field">
            <label for="fMemo">메모</label>
            <textarea class="input" id="fMemo" maxlength="400" placeholder="추천 메뉴, 영업시간, 웨이팅 팁 등"></textarea>
          </div>
          <div class="field">
            <label for="fLink">참고 링크 (선택)</label>
            <input class="input" id="fLink" type="url" placeholder="네이버·카카오맵, 인스타 링크" autocomplete="off">
          </div>
          <p class="err" id="formErr" hidden></p>
        </div>
        <div class="sheet-foot">
          <button class="btn ghost" type="button" id="sheetCancel">취소</button>
          <button class="btn primary" type="submit" id="sheetSave">등록</button>
        </div>
      </form>
    </aside>
  </section>

  <section id="viewPlan" hidden>
    <div class="plan-wrap" id="plan"></div>
  </section>

  <section id="viewStay" hidden>
    <div class="stay-wrap" id="stayView"></div>
  </section>

  <section id="viewFlights" hidden>
    <div class="flights" id="flights"></div>
  </section>
</main>

<div class="who" id="who" hidden>
  <div class="who-card">
    <h2>누구세요?</h2>
    <p>이름을 고르면 등록한 장소에 표시돼요. 이 기기에서 기억해 둘게요.</p>
    <div class="who-grid" id="whoGrid"></div>
  </div>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="kakao-config.js"></script>
<script>
(() => {
"use strict";

const MEMBERS = ["강희교","백지민","장신영","주하은","김은수","우혜원","이윤주","정희원"];
const CATS = {
  food: { label: "식당",   short: "식" },
  cafe: { label: "카페",   short: "카" },
  fun:  { label: "유원지", short: "놀" },
};
const JEJU = { center: [33.38, 126.56], sw: [33.10, 126.10], ne: [33.62, 127.00] };
const KAKAO_CAT = { FD6: "food", CE7: "cafe", AT4: "fun", CT1: "fun" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "";
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* ───────── 저장소: Firebase가 설정되면 공유, 아니면 이 기기에만 ───────── */
function firebaseStore(cfg) {
  firebase.initializeApp(cfg);
  const db = firebase.firestore();
  const ready = firebase.auth().signInAnonymously();
  const FV = firebase.firestore.FieldValue;
  const places = db.collection("places");
  const flights = db.collection("trip").doc("flights");
  return {
    shared: true,
    onPlaces(cb, onErr) {
      ready.then(() => places.orderBy("createdAt", "desc").onSnapshot(
        (s) => cb(s.docs.map((d) => ({ id: d.id, ...d.data() }))), onErr)).catch(onErr);
    },
    addPlace: (p) => ready.then(() => places.add({ ...p, likes: [], createdAt: Date.now() })),
    updatePlace: (id, patch) => ready.then(() => places.doc(id).update(patch)),
    deletePlace: (id) => ready.then(() => places.doc(id).delete()),
    toggleLike: (id, name, on) => ready.then(() => places.doc(id).update({ likes: on ? FV.arrayUnion(name) : FV.arrayRemove(name) })),
    onFlights(cb, onErr) {
      ready.then(() => flights.onSnapshot((d) => cb(d.exists ? d.data() : null), onErr)).catch(onErr);
    },
    saveFlights: (data) => ready.then(() => flights.set(data)),
    onStay(cb, onErr) {
      ready.then(() => db.collection("trip").doc("stay").onSnapshot((d) => cb(d.exists ? d.data() : null), onErr)).catch(onErr);
    },
    saveStay: (data) => ready.then(() => db.collection("trip").doc("stay").set(data)),
    onPlans(cb, onErr) {
      ready.then(() => db.collection("plans").onSnapshot((s) => cb(s.docs.map((d) => ({ id: d.id, ...d.data() }))), onErr)).catch(onErr);
    },
    addPlan: (p) => ready.then(() => db.collection("plans").add({ ...p, createdAt: Date.now() })),
    updatePlan: (id, patch) => ready.then(() => db.collection("plans").doc(id).update(patch)),
    deletePlan: (id) => ready.then(() => db.collection("plans").doc(id).delete()),
  };
}
function localStore() {
  const subs = { places: [], flights: [], stay: [], plans: [] };
  const mutPlans = (fn) => { const l = ls.get("jeju.plans", []); fn(l); ls.set("jeju.plans", l); subs.plans.forEach((f) => f(l)); return Promise.resolve(); };
  const emitP = () => { const list = ls.get("jeju.places", []).sort((a, b) => b.createdAt - a.createdAt); subs.places.forEach((f) => f(list)); };
  const emitF = () => subs.flights.forEach((f) => f(ls.get("jeju.flights", null)));
  const mut = (fn) => { const list = ls.get("jeju.places", []); fn(list); ls.set("jeju.places", list); emitP(); return Promise.resolve(); };
  addEventListener("storage", (e) => { if (e.key === "jeju.places") emitP(); if (e.key === "jeju.flights") emitF(); });
  return {
    shared: false,
    onPlaces(cb) { subs.places.push(cb); emitP(); },
    addPlace: (p) => mut((l) => l.push({ ...p, id: "p" + Date.now().toString(36), likes: [], createdAt: Date.now() })),
    updatePlace: (id, patch) => mut((l) => { const p = l.find((x) => x.id === id); if (p) Object.assign(p, patch); }),
    deletePlace: (id) => mut((l) => { const i = l.findIndex((x) => x.id === id); if (i > -1) l.splice(i, 1); }),
    toggleLike: (id, name, on) => mut((l) => {
      const p = l.find((x) => x.id === id); if (!p) return;
      p.likes = (p.likes || []).filter((n) => n !== name); if (on) p.likes.push(name);
    }),
    onFlights(cb) { subs.flights.push(cb); emitF(); },
    saveFlights: (data) => { ls.set("jeju.flights", data); emitF(); return Promise.resolve(); },
    onStay(cb) { subs.stay.push(cb); cb(ls.get("jeju.stay", null)); },
    saveStay: (data) => { ls.set("jeju.stay", data); subs.stay.forEach((f) => f(data)); return Promise.resolve(); },
    onPlans(cb) { subs.plans.push(cb); cb(ls.get("jeju.plans", [])); },
    addPlan: (p) => mutPlans((l) => l.push({ ...p, id: "q" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), createdAt: Date.now() })),
    updatePlan: (id, patch) => mutPlans((l) => { const p = l.find((x) => x.id === id); if (p) Object.assign(p, patch); }),
    deletePlan: (id) => mutPlans((l) => { const i = l.findIndex((x) => x.id === id); if (i > -1) l.splice(i, 1); }),
  };
}
const cfg = window.FIREBASE_CONFIG;
const Store = (cfg && cfg.apiKey && window.firebase) ? firebaseStore(cfg) : localStore();
$("demoBanner").hidden = Store.shared;

/* ───────── 상태 ───────── */
const state = {
  me: ls.get("jeju.me", null),
  places: [],
  flights: null,
  filter: "all",
  sort: ls.get("jeju.sort", "new"),
  activeId: null,
  editingId: null,
  draftLoc: null,
  stay: null,
  plans: [],
  planDay: 0,
};

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2200);
}
const fail = (e) => { console.error(e); toast("저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요."); };

/* ───────── 이름 선택 ───────── */
function renderMe() {
  $("meName").textContent = state.me || "이름 선택";
  $("meAvatar").textContent = state.me ? (state.me.charAt(1) || state.me[0]) : "?";
}
function openWho() {
  $("whoGrid").innerHTML = MEMBERS.map((n) => `<button type="button" class="${n === state.me ? "me" : ""}" data-name="${esc(n)}">${esc(n)}</button>`).join("");
  $("who").hidden = false;
}
$("whoGrid").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-name]"); if (!b) return;
  state.me = b.dataset.name; ls.set("jeju.me", state.me);
  $("who").hidden = true; renderMe(); renderList();
});
$("meChip").onclick = openWho;

/* ───────── 탭 ───────── */
const TABS = { map: ["tabMap", "viewMap"], plan: ["tabPlan", "viewPlan"], stay: ["tabStay", "viewStay"], flights: ["tabFlights", "viewFlights"] };
function setTab(which) {
  for (const [k, [t, v]] of Object.entries(TABS)) {
    $(t).setAttribute("aria-selected", k === which);
    $(v).hidden = k !== which;
  }
  if (which === "map") setTimeout(relayout, 0);
  if (which === "plan") renderPlan();
  if (which === "stay") renderStay();
}
for (const k of Object.keys(TABS)) $(TABS[k][0]).onclick = () => setTab(k);
$("flightChip").onclick = () => setTab("flights");
function setScreenH() { document.documentElement.style.setProperty("--screen-h", innerHeight + "px"); }
const touch = matchMedia("(pointer: coarse)").matches;
setScreenH();
let lastW = innerWidth;
addEventListener("orientationchange", () => setTimeout(() => { setScreenH(); relayout(); }, 300));
function fitChrome() {
  const h = $("top").offsetHeight + document.querySelector(".tabs").offsetHeight + ($("demoBanner").hidden ? 0 : $("demoBanner").offsetHeight);
  document.documentElement.style.setProperty("--chrome", h + "px");
}
addEventListener("resize", () => {
  // 키보드가 열릴 때(높이만 변함)는 무시하고, 폭이 바뀔 때만 다시 계산
  if (!touch || innerWidth !== lastW) { lastW = innerWidth; setScreenH(); }
  fitChrome(); relayout();
});

/* ───────── 지도 (카카오맵) ───────── */
let map = null, kPlaces = null, geocoder = null, infoOverlay = null, tempOverlay = null;
const markers = new Map();
const LL = (lat, lng) => new kakao.maps.LatLng(lat, lng);
const kakaoLink = (p) => p.kakaoUrl || `https://map.kakao.com/link/search/${encodeURIComponent(p.name)}`;

function showMapMsg(title, body) {
  $("map").innerHTML = `<div class="map-msg"><div><b>${esc(title)}</b>${esc(body)}</div></div>`;
}
function loadKakao() {
  const key = (window.KAKAO_JS_KEY || "").trim();
  if (!key) return showMapMsg("카카오맵 키가 아직 없어요", "kakao-config.js에 JavaScript 키를 넣어주세요.");
  const s = document.createElement("script");
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&libraries=services&autoload=false`;
  s.onload = () => { try { kakao.maps.load(initMap); } catch (e) { mapFail(e); } };
  s.onerror = mapFail;
  document.head.appendChild(s);
}
function mapFail(e) {
  console.error(e);
  showMapMsg("카카오맵을 불러오지 못했어요", "키가 맞는지, 카카오 개발자 사이트에 이 사이트 주소를 등록했는지 확인해 주세요.");
}
function initMap() {
  const narrow = innerWidth < 600;
  JEJU.level = narrow ? 11 : 10;
  map = new kakao.maps.Map($("map"), { center: LL(...JEJU.center), level: JEJU.level });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  kPlaces = new kakao.maps.services.Places();
  geocoder = new kakao.maps.services.Geocoder();
  kakao.maps.event.addListener(map, "click", (e) => {
    if (!$("sheet").hidden) setDraftLoc(e.latLng.getLat(), e.latLng.getLng(), "", "", true);
    else closeInfo();
  });
  renderMarkers();
}
function relayout() { if (map) map.relayout(); }
function goHome() {
  if (!map) return;
  closeInfo();
  map.setLevel(JEJU.level);
  map.setCenter(LL(...JEJU.center));
}
$("homeBtn").onclick = goHome;

function popupHtml(p) {
  const link = safeUrl(p.link);
  return `<div class="pop"><strong>${esc(p.name)}</strong>
    <span class="meta">${CATS[p.cat].label} · ${esc(p.by)} 등록 · 가고 싶어요 ${(p.likes || []).length}</span>
    ${p.memo ? `<p>${esc(p.memo)}</p>` : ""}
    <div class="links">
      <a href="${esc(kakaoLink(p))}" target="_blank" rel="noopener">카카오맵</a>
      <a href="https://map.naver.com/p/search/${encodeURIComponent(p.name)}" target="_blank" rel="noopener">네이버지도</a>
      ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">참고 링크</a>` : ""}
    </div></div>`;
}
function closeInfo() { if (infoOverlay) { infoOverlay.setMap(null); infoOverlay = null; } }
function openInfo(p) {
  closeInfo();
  const wrap = document.createElement("div");
  wrap.className = "info-wrap";
  wrap.innerHTML = `<div class="info">${popupHtml(p)}<button type="button" class="info-x" aria-label="닫기">×</button></div>`;
  wrap.querySelector(".info-x").onclick = closeInfo;
  infoOverlay = new kakao.maps.CustomOverlay({ position: LL(p.lat, p.lng), content: wrap, yAnchor: 1, clickable: true, zIndex: 50 });
  infoOverlay.setMap(map);
}
function pinEl(p, sel) {
  const el = document.createElement("button");
  el.type = "button";
  el.className = `pin c-${p.cat}${sel ? " sel" : ""}`;
  el.setAttribute("aria-label", p.name);
  el.innerHTML = `<span>${CATS[p.cat].short}</span>`;
  el.onclick = () => selectPlace(p.id, false);
  return el;
}
function renderMarkers() {
  if (!map) return;
  const visible = new Set(filtered().map((p) => p.id));
  for (const [id, o] of markers) if (!visible.has(id)) { o.setMap(null); markers.delete(id); }
  for (const p of state.places) {
    if (!visible.has(p.id)) continue;
    const sel = p.id === state.activeId;
    let o = markers.get(p.id);
    if (!o) {
      o = new kakao.maps.CustomOverlay({ position: LL(p.lat, p.lng), content: pinEl(p, sel), yAnchor: 1.2, clickable: true, zIndex: sel ? 10 : 1 });
      o.setMap(map);
      markers.set(p.id, o);
      continue;
    }
    o.setPosition(LL(p.lat, p.lng));
    o.setContent(pinEl(p, sel));
    o.setZIndex(sel ? 10 : 1);
  }
  renderStayMarker();
  if (infoOverlay && state.activeId !== "__stay") {
    const p = state.places.find((x) => x.id === state.activeId);
    if (p && visible.has(p.id)) openInfo(p); else closeInfo();
  }
}
let stayOverlay = null;
function renderStayMarker() {
  if (!map) return;
  const st = state.stay;
  if (!st || !isFinite(st.lat) || !isFinite(st.lng)) { if (stayOverlay) { stayOverlay.setMap(null); stayOverlay = null; } return; }
  const el = document.createElement("button");
  el.type = "button"; el.className = "pin c-stay"; el.setAttribute("aria-label", "숙소 " + st.name);
  el.innerHTML = "<span>숙</span>";
  el.onclick = () => openStayInfo();
  if (!stayOverlay) {
    stayOverlay = new kakao.maps.CustomOverlay({ position: LL(st.lat, st.lng), content: el, yAnchor: 1.2, clickable: true, zIndex: 5 });
    stayOverlay.setMap(map);
  } else { stayOverlay.setPosition(LL(st.lat, st.lng)); stayOverlay.setContent(el); }
}
function openStayInfo() {
  const st = state.stay; if (!st || !map) return;
  closeInfo(); state.activeId = "__stay";
  const wrap = document.createElement("div");
  wrap.className = "info-wrap";
  const link = safeUrl(st.link);

function kakaoSearch(q, r, onPick, emptyMsg) {
  if (!q) return;
  const msg = (t) => { r.hidden = false; r.innerHTML = `<li><button type="button" disabled>${esc(t)}</button></li>`; };
  if (!kPlaces) return msg("지도가 아직 준비되지 않았어요. 잠시 후 다시 검색해 주세요.");
  msg("검색 중…");
  const bounds = new kakao.maps.LatLngBounds(LL(...JEJU.sw), LL(...JEJU.ne));
  kPlaces.keywordSearch(q, (data, status) => {
    const S = kakao.maps.services.Status;
    if (status === S.ZERO_RESULT) return msg(emptyMsg);
    if (status !== S.OK) return msg("검색에 실패했어요. 잠시 후 다시 시도해 주세요.");
    r.innerHTML = data.map((d, i) => {
      const kind = (d.category_name || "").split(">").pop().trim();
      const addr = d.road_address_name || d.address_name;
      return `<li><button type="button" data-i="${i}">${esc(d.place_name)}<small>${esc([kind, addr].filter(Boolean).join(" · "))}</small></button></li>`;
    }).join("");
    r.onclick = (e) => {
      const b = e.target.closest("button[data-i]"); if (!b) return;
      r.hidden = true;
      onPick(data[+b.dataset.i]);
    };
  }, { bounds, size: 8 });
}
function search() {
  kakaoSearch($("fSearch").value.trim() || $("fName").value.trim(), $("results"), (d) => {
    const lat = +d.y, lng = +d.x;

    if (!$("fName").value.trim() || !state.editingId) $("fName").value = d.place_name;
    const cat = KAKAO_CAT[d.category_group_code];
    if (cat) $({ food: "catFood", cafe: "catCafe", fun: "catFun" }[cat]).checked = true;

  }, "제주에서 찾은 결과가 없어요. 지도를 눌러 직접 찍어주세요.");
}

/* ───────── 항공권 ───────── */
const WD = ["일","월","화","수","목","금","토"];
const parseD = (date, time) => date ? new Date(`${date}T${time || "00:00"}:00`) : null;
const fmtDate = (date) => { const d = parseD(date); return d ? `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})` : "날짜 미정"; };
function dday(date) {
  const d = parseD(date); if (!d) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const n = Math.round((d - t) / 86400000);
  return n > 0 ? `D-${n}` : n === 0 ? "D-DAY" : `여행 ${-n + 1}일째`;
}
function renderFlightChip() {

const fmtMin = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;

function fmtShort(date) { const d = parseD(date); return d ? `${d.getMonth() + 1}/${d.getDate()} (${WD[d.getDay()]})` : ""; }
function addDays(date, n) { const d = parseD(date); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function durText(m) { const h = Math.floor(m / 60), r = m % 60; return h && r ? `${h}시간 ${r}분` : h ? `${h}시간` : `${r}분`; }

        ${st.memo ? `<p class="stay-memo">${esc(st.memo)}</p>` : ""}
        <div class="stay-foot">
          ${isFinite(st.lat) ? `<button type="button" class="textbtn" id="stayOnMap">지도에서 보기</button>` : ""}
          <a href="${esc(st.kakaoUrl || "https://map.kakao.com/link/search/" + encodeURIComponent(st.name))}" target="_blank" rel="noopener">카카오맵</a>
          ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">예약 링크</a>` : ""}
          ${st.updatedBy ? `<span>마지막 수정: ${esc(st.updatedBy)}</span>` : ""}
        </div>
      </article>`;
    const onMap = $("stayOnMap");
    if (onMap) onMap.onclick = () => {
      setTab("map");
      setTimeout(() => { if (!map) return; if (map.getLevel() > 6) map.setLevel(6); map.panTo(LL(st.lat, st.lng)); openStayInfo(); }, 60);
    };
  }
  $("stayEditBtn").onclick = () => { if (!state.me) return openWho(); stayEditing = true; renderStay(); };
}
let stayDraft = null;
function renderStayForm() {
  const st = state.stay || {}, f = state.flights || {};
  stayDraft = isFinite(st.lat) ? { lat: st.lat, lng: st.lng, addr: st.addr || "", url: st.kakaoUrl || "" } : null;
  const v = (x) => esc(x || "");
  $("stayView").innerHTML = `<div class="flights-head"><div><h2>${state.stay ? "숙소 수정" : "숙소 등록"}</h2><p>입력하면 모두에게 똑같이 보여요.</p></div></div>
    <form class="fform" id="stayForm" novalidate>
      <div class="field"><label for="s-name">숙소 이름</label><input class="input" id="s-name" maxlength="60" value="${v(st.name)}" placeholder="예: 애월 오션뷰 펜션"></div>
      <div class="field"><label for="s-search">위치</label>
        <div class="row"><input class="input" id="s-search" placeholder="카카오맵에서 숙소명·주소 검색" autocomplete="off"><button class="btn small" type="button" id="s-searchBtn">검색</button></div>
        <ul class="results" id="s-results" hidden></ul>
        <div class="loc${stayDraft ? " set" : ""}" id="s-loc">${stayDraft ? "📍 " + esc(stayDraft.addr || "위치 지정됨") : "위치를 아직 정하지 않았어요"}</div>
      </div>
      <fieldset>
        <div class="field"><label for="s-inDate">체크인 날짜</label><input class="input" type="date" id="s-inDate" value="${v(st.inDate || (f.out && f.out.date))}"></div>
        <div class="field"><label for="s-inTime">체크인 시각</label><input class="input" type="time" id="s-inTime" value="${v(st.inTime || "15:00")}"></div>
        <div class="field"><label for="s-outDate">체크아웃 날짜</label><input class="input" type="date" id="s-outDate" value="${v(st.outDate || (f.back && f.back.date))}"></div>
        <div class="field"><label for="s-outTime">체크아웃 시각</label><input class="input" type="time" id="s-outTime" value="${v(st.outTime || "11:00")}"></div>
      </fieldset>
      <div class="field"><label for="s-link">예약 링크 (선택)</label><input class="input" type="url" id="s-link" value="${v(st.link)}" placeholder="에어비앤비, 야놀자 예약 페이지 등"></div>
      <div class="field"><label for="s-memo">메모 (선택)</label><textarea class="input" id="s-memo" maxlength="400" placeholder="예: 주차 2대 가능, 바비큐 신청 필요">${v(st.memo)}</textarea></div>
      <p class="err" id="s-err" hidden></p>
      <div class="fform-foot"><button class="btn ghost" type="button" id="s-cancel">취소</button><button class="btn primary" type="submit">저장</button></div>
    </form>`;
  const doSearch = () => kakaoSearch($("s-search").value.trim() || $("s-name").value.trim(), $("s-results"), (d) => {
    stayDraft = { lat: +d.y, lng: +d.x, addr: d.road_address_name || d.address_name, url: d.place_url };
    if (!$("s-name").value.trim()) $("s-name").value = d.place_name;
    $("s-loc").classList.add("set"); $("s-loc").textContent = "📍 " + stayDraft.addr;
  }, "제주에서 찾은 결과가 없어요. 숙소 주소로 검색해 보세요.");
  $("s-searchBtn").onclick = doSearch;
  $("s-search").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doSearch(); } });
  $("s-cancel").onclick = () => { stayEditing = false; renderStay(); };
  $("stayForm").onsubmit = (e) => {
    e.preventDefault();
    const err = (m) => { $("s-err").textContent = m; $("s-err").hidden = false; };
    const name = $("s-name").value.trim();
    if (!name) return err("숙소 이름을 입력해 주세요.");
    const link = $("s-link").value.trim();
    if (link && !safeUrl(link)) return err("링크는 http:// 또는 https:// 로 시작해야 해요.");
    const data = {
      name, link, memo: $("s-memo").value.trim(),
      inDate: $("s-inDate").value, inTime: $("s-inTime").value, outDate: $("s-outDate").value, outTime: $("s-outTime").value,
      lat: stayDraft ? stayDraft.lat : null, lng: stayDraft ? stayDraft.lng : null,
      addr: stayDraft ? stayDraft.addr : "", kakaoUrl: stayDraft ? stayDraft.url : "",
      updatedBy: state.me, updatedAt: Date.now(),
    };
    Store.saveStay(data).then(() => { stayEditing = false; toast("숙소를 저장했어요"); renderStay(); }).catch(fail);
  };
}

/* ───────── 계획표 ───────── */
const ROW = 46;
function tripDays() {
  const f = state.flights;
  if (!f || !f.out || !f.out.date || !f.back || !f.back.date) return null;
  const days = [];
  for (let d = f.out.date; d <= f.back.date && days.length < 14; d = addDays(d, 1)) days.push(d);
  return days.length ? days : null;
}
function fixedEvents(date) {
  const f = state.flights || {}, st = state.stay, ev = [];
  const leg = (l, label, timeKey) => {
    const m = toMin(l[timeKey]); if (m == null) return;
    ev.push({ fixed: true, start: floor30(m), dur: 30, title: label, sub: `${l[timeKey]} · ${[l.airline, l.no].filter(Boolean).join(" ")}` });
  };
  if (f.out && f.out.date === date) leg(f.out, "✈ 제주 도착", "arrTime");
  if (f.back && f.back.date === date) leg(f.back, "✈ 귀가편 출발", "depTime");
  if (st) {
    const add = (d, t, label) => { const m = toMin(t); if (d === date && m != null) ev.push({ fixed: true, start: floor30(m), dur: 30, title: label, sub: `${t} · ${st.name}` }); };
    add(st.inDate, st.inTime, "체크인");
    add(st.outDate, st.outTime, "체크아웃");
  }
  return ev;
}
function dayRange(date, days, items) {
  const f = state.flights;
  let start = 7 * 60, end = 24 * 60;
  if (date === days[0] && toMin(f.out.arrTime) != null) start = floor30(toMin(f.out.arrTime));
  if (date === days[days.length - 1] && toMin(f.back.depTime) != null) end = floor30(toMin(f.back.depTime)) + 30;
  for (const it of items) { start = Math.min(start, it.start); end = Math.max(end, it.start + it.dur); }
  if (end <= start) end = start + 60;
  return [start, Math.min(end, 24 * 60)];
}
function layoutLanes(items) {
  const sorted = [...items].sort((a, b) => a.start - b.start || b.dur - a.dur);
  let cluster = [], clusterEnd = -1;
  const flush = () => {
    const lanes = [];
    for (const it of cluster) {
      let li = lanes.findIndex((end) => end <= it.start);
      if (li < 0) { li = lanes.length; lanes.push(0); }
      lanes[li] = it.start + it.dur; it.lane = li;
    }
    for (const it of cluster) it.lanes = lanes.length;
    cluster = [];
  };
  for (const it of sorted) {
    if (it.start >= clusterEnd && cluster.length) flush();
    cluster.push(it); clusterEnd = Math.max(clusterEnd, it.start + it.dur);
  }
  flush();
  return sorted;
}
function planLabel(p) {
  if (p.placeId) {
    const pl = state.places.find((x) => x.id === p.placeId);
    return pl ? { title: pl.name, cat: pl.cat } : { title: "(삭제된 장소)", cat: "free" };
  }
  return { title: p.title || "일정", cat: "free" };
}
function renderPlan() {
  const days = tripDays();
  if (!days) {
    $("plan").innerHTML = `<div class="flights-head"><div><h2>계획표</h2><p>30분 단위로 하루 일정을 같이 짜요.</p></div></div>
      <div class="plan-empty"><b>항공편을 먼저 입력해 주세요</b>가는 날과 오는 날을 입력하면 그 기간으로 계획표가 만들어져요.<br>
      <button class="btn primary" type="button" id="goFlights">항공편 입력하러 가기</button></div>`;
    $("goFlights").onclick = () => setTab("flights");
    return;
  }
  if (state.planDay >= days.length) state.planDay = 0;
  const date = days[state.planDay];
  const plans = state.plans.filter((p) => p.date === date).map((p) => ({ ...p, start: toMin(p.start), dur: +p.dur || 30 })).filter((p) => p.start != null);
  const items = layoutLanes([...fixedEvents(date), ...plans]);
  const [start, end] = dayRange(date, days, items);
  const rows = (end - start) / 30;
  const dayTabs = days.map((d, i) => `<button type="button" class="day-tab" data-day="${i}" aria-pressed="${i === state.planDay}"><b>${i + 1}일차</b><small>${esc(fmtShort(d))}</small></button>`).join("");
  let times = "", slots = "";
  for (let i = 0; i < rows; i++) {
    const m = start + i * 30, half = m % 60 !== 0;
    times += `<div class="tl-time${half ? " half" : ""}">${fmtMin(m)}</div>`;
    slots += `<button type="button" class="tl-slot ${half ? "half" : "hour"}" data-start="${m}" aria-label="${fmtMin(m)}에 일정 추가">+ ${fmtMin(m)} 일정 추가</button>`;
  }
  const blocks = items.map((it) => {
    const top = (it.start - start) / 30 * ROW + 2, h = it.dur / 30 * ROW - 4;
    const w = 100 / it.lanes, left = w * it.lane;
    const pos = `top:${top}px;height:${h}px;left:calc(${left}% + 6px);width:calc(${w}% - 12px)`;
    if (it.fixed) return `<div class="tl-item fixed" style="${pos}"><b>${esc(it.title)}</b><small>${esc(it.sub)}</small></div>`;
    const lb = planLabel(it);
    return `<button type="button" class="tl-item c-${lb.cat}" style="${pos}" data-plan="${esc(it.id)}">
      <b>${esc(lb.title)}</b><small>${fmtMin(it.start)}–${fmtMin(it.start + it.dur)} · ${durText(it.dur)}</small></button>`;
  }).join("");
  $("plan").innerHTML = `<div class="flights-head"><div><h2>계획표</h2><p>빈 칸을 누르면 그 시간에 일정을 넣을 수 있어요.</p></div></div>
    <div class="day-tabs" id="dayTabs">${dayTabs}</div>
    <div class="timeline" style="--row:${ROW}px">
      <div class="tl-times">${times}</div>
      <div class="tl-body" id="tlBody">${slots}${blocks}</div>
    </div>`;
  $("dayTabs").onclick = (e) => { const b = e.target.closest("[data-day]"); if (!b) return; state.planDay = +b.dataset.day; renderPlan(); };
  $("tlBody").onclick = (e) => {
    const it = e.target.closest("[data-plan]");
    if (it) return openPlanModal(state.plans.find((p) => p.id === it.dataset.plan));
    const sl = e.target.closest("[data-start]");
    if (sl) openPlanModal(null, date, +sl.dataset.start);
  };
}
function openPlanModal(plan, date, startMin) {
  if (!state.me) return openWho();
  const days = tripDays(); if (!days) return;
  date = plan ? plan.date : date;
  const st = plan ? toMin(plan.start) : startMin;
  const dur = plan ? +plan.dur : 60;
  const mode = plan && !plan.placeId ? "free" : "place";
  let filter = "all";
  const startOpts = []; for (let m = 0; m < 24 * 60; m += 30) startOpts.push(`<option value="${m}"${m === st ? " selected" : ""}>${fmtMin(m)}</option>`);
  const durOpts = [30, 60, 90, 120, 150, 180, 240, 300, 360, 480].map((m) => `<option value="${m}"${m === dur ? " selected" : ""}>${durText(m)}</option>`).join("");
  openModal(`<form id="planForm" novalidate style="display:contents">
    <div class="sheet-head"><h2>${plan ? "일정 수정" : "일정 추가"} · ${esc(fmtShort(date))}</h2><button class="btn small ghost" type="button" id="pClose">닫기</button></div>
    <div class="sheet-body">
      <div class="two">
        <div class="field"><label for="pStart">시작</label><select class="input" id="pStart">${startOpts.join("")}</select></div>
        <div class="field"><label for="pDur">소요 시간</label><select class="input" id="pDur">${durOpts}</select></div>
      </div>
      <div class="field"><span class="lbl">무엇을 할까요</span>
        <div class="seg2">
          <label><input type="radio" name="pMode" value="place" id="pModePlace"${mode === "place" ? " checked" : ""}><span>등록한 장소</span></label>
          <label><input type="radio" name="pMode" value="free" id="pModeFree"${mode === "free" ? " checked" : ""}><span>직접 입력</span></label>
        </div>
      </div>
      <div class="field" id="pPlaceBox">
        <div class="filters" id="pFilters"></div>
        <ul class="pick-list" id="pList"></ul>
      </div>
      <div class="field" id="pFreeBox">
        <label for="pTitle">일정 이름</label>
        <input class="input" id="pTitle" maxlength="60" value="${esc(plan && !plan.placeId ? plan.title : "")}" placeholder="예: 렌터카 픽업, 자유시간">
      </div>
      <p class="err" id="pErr" hidden></p>
    </div>
    <div class="sheet-foot">
      ${plan ? `<button class="btn danger" type="button" id="pDel">삭제</button>` : ""}
      <button class="btn ghost" type="button" id="pCancel">취소</button>
      <button class="btn primary" type="submit">${plan ? "저장" : "추가"}</button>
    </div></form>`);
  let picked = plan ? plan.placeId : "";
  const drawList = () => {
    const chip = (k, label) => `<button type="button" class="fchip" data-f="${k}" aria-pressed="${filter === k}">${k !== "all" ? `<span class="sw c-${k}"></span>` : ""}${label}</button>`;
    $("pFilters").innerHTML = chip("all", "전체") + Object.entries(CATS).map(([k, c]) => chip(k, c.label)).join("");
    const list = state.places.filter((p) => filter === "all" || p.cat === filter);
    $("pList").innerHTML = list.length ? list.map((p) => `<li><label>
        <input type="radio" name="pPlace" value="${esc(p.id)}"${p.id === picked ? " checked" : ""}>
        <span class="dot c-${p.cat}" aria-hidden="true">${CATS[p.cat].short}</span>
        <span class="t"><b>${esc(p.name)}</b>${p.addr ? `<small>${esc(p.addr)}</small>` : ""}</span></label></li>`).join("")
      : `<li class="none">${state.places.length ? "이 종류로 등록된 장소가 없어요." : "아직 등록된 장소가 없어요. 지도 · 장소 탭에서 먼저 추가해 주세요."}</li>`;
  };
  const syncMode = () => {
    const free = $("pModeFree").checked;
    $("pPlaceBox").hidden = free; $("pFreeBox").hidden = !free;
  };
  drawList(); syncMode();
  $("pFilters").onclick = (e) => { const b = e.target.closest("[data-f]"); if (!b) return; filter = b.dataset.f; drawList(); };
  $("pList").onchange = (e) => { if (e.target.name === "pPlace") picked = e.target.value; };
  $("pModePlace").onchange = syncMode; $("pModeFree").onchange = syncMode;
  $("pClose").onclick = closeModal; $("pCancel").onclick = closeModal;
  if (plan) $("pDel").onclick = () => {
    if (!confirm("이 일정을 계획표에서 뺄까요?")) return;
    Store.deletePlan(plan.id).then(() => { closeModal(); toast("일정을 뺐어요"); }).catch(fail);
  };
  $("planForm").onsubmit = (e) => {
    e.preventDefault();
    const err = (m) => { $("pErr").textContent = m; $("pErr").hidden = false; };
    const free = $("pModeFree").checked;
    const startM = +$("pStart").value, durM = +$("pDur").value;
    if (startM + durM > 24 * 60) return err("자정을 넘기지 않게 시작 시간이나 소요 시간을 줄여 주세요.");
    const data = { date, start: fmtMin(startM), dur: durM, placeId: "", title: "" };
    if (free) { data.title = $("pTitle").value.trim(); if (!data.title) return err("일정 이름을 입력해 주세요."); }
    else { if (!picked) return err("넣을 장소를 골라 주세요."); data.placeId = picked; }
    const job = plan ? Store.updatePlan(plan.id, data) : Store.addPlan({ ...data, by: state.me });
    job.then(() => { closeModal(); toast(plan ? "일정을 수정했어요" : "계획표에 넣었어요"); }).catch(fail);
  };
}

/* ───────── 시작 ───────── */
function renderAll() { renderFilters(); renderList(); renderMarkers(); }
renderMe(); fitChrome(); renderAll(); renderFlights(); loadKakao();
if (!state.me) openWho();
const loadErr = (e) => { console.error(e); toast("데이터를 불러오지 못했어요. 새로고침해 주세요."); };
Store.onPlaces((list) => {
  state.places = list.filter((p) => CATS[p.cat] && isFinite(p.lat) && isFinite(p.lng));
  if (state.activeId && state.activeId !== "__stay" && !state.places.some((p) => p.id === state.activeId)) state.activeId = null;
  renderAll();
  if (!$("viewPlan").hidden) renderPlan();
}, loadErr);
Store.onFlights((f) => {
  state.flights = f;
  if (!flightEditing) renderFlights(); else renderFlightChip();
  if (!$("viewPlan").hidden) renderPlan();
}, loadErr);
Store.onStay((st) => {
  state.stay = st;
  if (!stayEditing && !$("viewStay").hidden) renderStay();
  if (!$("viewPlan").hidden) renderPlan();
  renderStayMarker();
}, loadErr);
Store.onPlans((list) => {
  state.plans = list;
  if (!$("viewPlan").hidden) renderPlan();
}, loadErr);
if (TABS[location.hash.slice(1)]) setTab(location.hash.slice(1));
})();
</script>
</body>
