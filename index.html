<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리들의 제주</title>
<meta name="description" content="8명이 함께 고르는 제주 식당·카페·놀거리, 그리고 항공편 일정">

<meta property="og:type" content="website">
<meta property="og:title" content="우리들의 제주 ✈ 8명 여행 플래너">
<meta property="og:description" content="가고 싶은 식당·카페·놀거리를 지도에 찍어주세요">
<meta property="og:image" content="https://qorwlalsjimin.github.io/jeju-trip/og-image.png">
<meta property="og:url" content="https://qorwlalsjimin.github.io/jeju-trip/">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#E8742A">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
/* Layout: 지도가 주인공 — 데스크톱은 지도 | 목록 2단, 모바일은 지도 위·목록 아래. 항공권은 탑승권 카드. */
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --sunken:#E7EEEC;
  --ink:#1C2321; --muted:#5D6A67; --line:#D6E0DD;
  --accent:#E8742A; --accent-ink:#FFFFFF; --accent-soft:#FCE7D8;
  --food:#E8742A; --cafe:#8A5B3B; --fun:#1C8A84;
  --danger:#C2402E;
  --shadow:0 8px 28px rgba(28,35,33,.14);
  --f-display:"Gowun Batang", "Noto Serif KR", serif;
  --f-body:"Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121715; --surface:#1B2220; --sunken:#232C29;
    --ink:#E8EEEC; --muted:#98A6A2; --line:#2D3834;
    --accent:#F08A45; --accent-ink:#1B1208; --accent-soft:#3A2618;
    --food:#F08A45; --cafe:#C28E66; --fun:#3BB4AC;
    --danger:#EB6A55;
    --shadow:0 8px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
a{color:inherit}

/* ── header ── */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px 10px;padding-top:max(14px, env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand h1 i{font-style:normal;color:var(--accent)}
.brand small{color:var(--muted);font-size:13px;white-space:nowrap}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flight-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--sunken);font-size:13px;border:0;font-variant-numeric:tabular-nums}
.flight-chip b{color:var(--accent)}
.me-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.avatar{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700}

.tabs{display:flex;gap:4px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}

.banner{margin:0;padding:8px 16px;font-size:13px;background:var(--accent-soft);color:var(--ink)}

/* ── map view ── */
.map-view{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:calc(100dvh - var(--chrome, 120px))}
#map{height:100%;min-height:300px;background:var(--sunken)}
.side{display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line);background:var(--surface);overflow:hidden;position:relative}
.side-head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.fchip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.fchip .sw{width:8px;height:8px;border-radius:50%}
.side-tools{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sort{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:13px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--sunken)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}

.list{list-style:none;margin:0;padding:6px 0 90px;overflow:auto;flex:1}
.place{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 12px}
.place.active{background:var(--sunken)}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;grid-row:span 2}
.c-food{background:var(--food)} .c-cafe{background:var(--cafe)} .c-fun{background:var(--fun)}
.place-main{border:0;background:none;padding:0;text-align:left;min-width:0}
.place-main strong{display:block;font-size:15px}
.place-main .addr{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place-main .memo{margin:4px 0 0;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.place-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.like{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.like.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.textbtn{border:0;background:none;padding:0;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.textbtn.danger{color:var(--danger)}
.place-meta a{text-underline-offset:2px}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.fab{position:absolute;right:16px;bottom:16px;z-index:5;box-shadow:var(--shadow);padding:12px 18px;border-radius:999px}

/* ── form sheet ── */
.sheet{position:absolute;inset:0;background:var(--surface);z-index:10;display:flex;flex-direction:column}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:17px}
.sheet-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;padding-bottom:max(12px, env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg)}
textarea.input{min-height:72px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:flex;justify-content:center;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:9px;font-weight:600}
.seg input:checked+span{border-color:currentColor}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.seg .food{color:var(--food)} .seg .cafe{color:var(--cafe)} .seg .fun{color:var(--fun)}
.row{display:flex;gap:6px}
.row .input{flex:1;min-width:0}
.results{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.results li+li{border-top:1px solid var(--line)}
.results button{width:100%;text-align:left;border:0;background:var(--surface);padding:8px 12px;font-size:13.5px}
.results button small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results button:hover{background:var(--sunken)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.loc{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--sunken);font-variant-numeric:tabular-nums}
.loc.set{background:var(--accent-soft)}
.err{color:var(--danger);font-size:13px;margin:0}

/* ── map pins ── */
.pin{padding:0;cursor:pointer;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin span{transform:rotate(45deg);color:#fff;font:700 12px var(--f-body)}
.pin.temp{background:var(--ink);animation:bob .9s ease-in-out infinite alternate}
.pin.sel{outline:3px solid var(--ink);outline-offset:1px}
@keyframes bob{to{translate:0 -4px}}
@media (prefers-reduced-motion: reduce){.pin.temp{animation:none}}
.info-wrap{padding-bottom:44px}
.info{position:relative;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 32px 12px 14px;width:240px;white-space:normal}
.info::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.info-x{position:absolute;top:6px;right:6px;border:0;background:none;font-size:18px;line-height:1;padding:4px 6px;color:var(--muted)}
.pop strong{font-size:14px;display:block}
.pop .meta{color:var(--muted);font-size:12px}
.pop p{margin:6px 0;white-space:pre-wrap;font-size:13px}
.pop .links{display:flex;gap:10px;font-size:12.5px;margin-top:6px}
.pop .links a{color:var(--accent);text-underline-offset:2px}
.map-msg{height:100%;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-size:14px}
.map-msg b{display:block;color:var(--ink);margin-bottom:4px}

/* ── flights ── */
.flights{max-width:880px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:20px}
.flights-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.flights-head h2{font-family:var(--f-display);font-size:26px;margin:0}
.flights-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.passes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.pass{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pass-top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--ink);color:var(--bg);font-size:13px;letter-spacing:.04em}
.pass-top b{font-size:14px;letter-spacing:.06em}
.pass-route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:20px 18px 14px}
.port{min-width:0}
.port .city{font-family:var(--f-display);font-size:28px;line-height:1.1;display:block}
.port time{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.port.to{text-align:right}
.plane{color:var(--accent);font-size:20px}
.pass-cut{border-top:2px dashed var(--line);margin:0 14px;position:relative}
.pass-cut::before,.pass-cut::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.pass-cut::before{left:-25px}.pass-cut::after{right:-25px}
.pass-foot{display:flex;justify-content:space-between;gap:12px;padding:12px 18px 16px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pass-foot b{color:var(--ink);font-weight:600}
.pass.blank .pass-route{color:var(--muted)}
.stay{display:flex;gap:24px;flex-wrap:wrap;padding:16px 18px;border-radius:16px;background:var(--accent-soft)}
.stay div{display:flex;flex-direction:column}
.stay small{font-size:12px;color:var(--muted);letter-spacing:.04em}
.stay b{font-size:20px;font-variant-numeric:tabular-nums}
.ffoot{font-size:13px;color:var(--muted)}
.fform{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:18px}
.fform fieldset{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fform legend{font-weight:700;margin-bottom:8px;font-size:15px}
.fform-foot{display:flex;justify-content:flex-end;gap:8px}

/* ── who-are-you ── */
.who{position:fixed;inset:0;z-index:2000;background:rgba(18,23,21,.55);display:grid;place-items:center;padding:16px}
.who-card{background:var(--surface);border-radius:20px;padding:24px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.who-card h2{font-family:var(--f-display);margin:0 0 4px;font-size:24px}
.who-card p{margin:0 0 16px;color:var(--muted)}
.who-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.who-grid button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-weight:600;font-size:15px}
.who-grid button.me{border-color:var(--accent);background:var(--accent-soft)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:3000;box-shadow:var(--shadow)}

/* ── mobile ── */
@media (max-width: 820px){
  .map-view{display:block;height:auto}
  #map{height:46vh;position:sticky;top:0;z-index:1}
  .side{border-left:0;overflow:visible}
  .list{overflow:visible;padding-bottom:96px}
  .fab{position:fixed;bottom:max(16px, env(safe-area-inset-bottom))}
  .sheet{position:fixed;top:auto;max-height:58vh;border-radius:18px 18px 0 0;box-shadow:var(--shadow)}
  .brand h1{font-size:21px}
  .top-right{margin-left:0;width:100%}
}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="brand">
    <h1>우리들의 <i>제주</i></h1>
    <small id="summary">8명 · 장소 0곳</small>
  </div>
  <div class="top-right">
    <button class="flight-chip" id="flightChip" type="button">항공편 미등록</button>
    <button class="me-chip" id="meChip" type="button"><span class="avatar" id="meAvatar">?</span><span id="meName">이름 선택</span></button>
  </div>
</header>
<nav class="tabs" role="tablist">
  <button class="tab" role="tab" id="tabMap" aria-selected="true" type="button">지도 · 장소</button>
  <button class="tab" role="tab" id="tabFlights" aria-selected="false" type="button">항공권</button>
</nav>
<p class="banner" id="demoBanner" hidden>미리보기 모드: Firebase가 아직 연결되지 않아 등록한 내용이 이 기기에만 저장됩니다.</p>

<main>
  <section class="map-view" id="viewMap">
    <div id="map" aria-label="제주 지도"></div>
    <aside class="side">
      <div class="side-head">
        <div class="filters" id="filters"></div>
        <div class="side-tools">
          <span class="hint" id="listCount"></span>
          <select class="sort" id="sort" aria-label="정렬">
            <option value="new">최근 등록순</option>
            <option value="like">가고 싶어요 많은 순</option>
          </select>
        </div>
      </div>
      <ul class="list" id="list"></ul>
      <button class="btn primary fab" id="addBtn" type="button">+ 장소 추가</button>

      <form class="sheet" id="sheet" hidden novalidate>
        <div class="sheet-head">
          <h2 id="sheetTitle">장소 추가</h2>
          <button class="btn small ghost" type="button" id="sheetClose">닫기</button>
        </div>
        <div class="sheet-body">
          <div class="field">
            <span class="lbl">종류</span>
            <div class="seg">
              <label><input type="radio" name="cat" value="food" id="catFood" checked><span class="food">식당</span></label>
              <label><input type="radio" name="cat" value="cafe" id="catCafe"><span class="cafe">카페</span></label>
              <label><input type="radio" name="cat" value="fun" id="catFun"><span class="fun">유원지</span></label>
            </div>
          </div>
          <div class="field">
            <label for="fName">이름</label>
            <input class="input" id="fName" maxlength="60" placeholder="예: 우진해장국" autocomplete="off">
          </div>
          <div class="field">
            <label for="fSearch">위치</label>
            <div class="row">
              <input class="input" id="fSearch" placeholder="카카오맵에서 장소명·주소 검색" autocomplete="off">
              <button class="btn small" type="button" id="searchBtn">검색</button>
            </div>
            <ul class="results" id="results" hidden></ul>
            <p class="hint">검색 결과가 없으면 <b>지도를 눌러</b> 위치를 찍어주세요. 다시 누르면 핀이 옮겨져요.</p>
            <div class="loc" id="locBox">위치를 아직 정하지 않았어요</div>
          </div>
          <div class="field">
            <label for="fMemo">메모</label>
            <textarea class="input" id="fMemo" maxlength="400" placeholder="추천 메뉴, 영업시간, 웨이팅 팁 등"></textarea>
          </div>
          <div class="field">
            <label for="fLink">참고 링크 (선택)</label>
            <input class="input" id="fLink" type="url" placeholder="네이버·카카오맵, 인스타 링크" autocomplete="off">
          </div>
          <p class="err" id="formErr" hidden></p>
        </div>
        <div class="sheet-foot">
          <button class="btn ghost" type="button" id="sheetCancel">취소</button>
          <button class="btn primary" type="submit" id="sheetSave">등록</button>
        </div>
      </form>
    </aside>
  </section>

  <section id="viewFlights" hidden>
    <div class="flights" id="flights"></div>
  </section>
</main>

<div class="who" id="who" hidden>
  <div class="who-card">
    <h2>누구세요?</h2>
    <p>이름을 고르면 등록한 장소에 표시돼요. 이 기기에서 기억해 둘게요.</p>
    <div class="who-grid" id="whoGrid"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="kakao-config.js"></script>
<script>
(() => {
"use strict";

const MEMBERS = ["강희교","백지민","장신영","주하은","김은수","우혜원","이윤주","정희원"];
const CATS = {
  food: { label: "식당",   short: "식" },
  cafe: { label: "카페",   short: "카" },
  fun:  { label: "유원지", short: "놀" },
};
const JEJU = { center: [33.38, 126.56], sw: [33.10, 126.10], ne: [33.62, 127.00] };
const KAKAO_CAT = { FD6: "food", CE7: "cafe", AT4: "fun", CT1: "fun" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "";
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* ───────── 저장소: Firebase가 설정되면 공유, 아니면 이 기기에만 ───────── */
function firebaseStore(cfg) {
  firebase.initializeApp(cfg);
  const db = firebase.firestore();
  const ready = firebase.auth().signInAnonymously();
  const FV = firebase.firestore.FieldValue;
  const places = db.collection("places");
  const flights = db.collection("trip").doc("flights");
  return {
    shared: true,
    onPlaces(cb, onErr) {
      ready.then(() => places.orderBy("createdAt", "desc").onSnapshot(
        (s) => cb(s.docs.map((d) => ({ id: d.id, ...d.data() }))), onErr)).catch(onErr);
    },
    addPlace: (p) => ready.then(() => places.add({ ...p, likes: [], createdAt: Date.now() })),
    updatePlace: (id, patch) => ready.then(() => places.doc(id).update(patch)),
    deletePlace: (id) => ready.then(() => places.doc(id).delete()),
    toggleLike: (id, name, on) => ready.then(() => places.doc(id).update({ likes: on ? FV.arrayUnion(name) : FV.arrayRemove(name) })),
    onFlights(cb, onErr) {
      ready.then(() => flights.onSnapshot((d) => cb(d.exists ? d.data() : null), onErr)).catch(onErr);
    },
    saveFlights: (data) => ready.then(() => flights.set(data)),
  };
}
function localStore() {
  const subs = { places: [], flights: [] };
  const emitP = () => { const list = ls.get("jeju.places", []).sort((a, b) => b.createdAt - a.createdAt); subs.places.forEach((f) => f(list)); };
  const emitF = () => subs.flights.forEach((f) => f(ls.get("jeju.flights", null)));
  const mut = (fn) => { const list = ls.get("jeju.places", []); fn(list); ls.set("jeju.places", list); emitP(); return Promise.resolve(); };
  addEventListener("storage", (e) => { if (e.key === "jeju.places") emitP(); if (e.key === "jeju.flights") emitF(); });
  return {
    shared: false,
    onPlaces(cb) { subs.places.push(cb); emitP(); },
    addPlace: (p) => mut((l) => l.push({ ...p, id: "p" + Date.now().toString(36), likes: [], createdAt: Date.now() })),
    updatePlace: (id, patch) => mut((l) => { const p = l.find((x) => x.id === id); if (p) Object.assign(p, patch); }),
    deletePlace: (id) => mut((l) => { const i = l.findIndex((x) => x.id === id); if (i > -1) l.splice(i, 1); }),
    toggleLike: (id, name, on) => mut((l) => {
      const p = l.find((x) => x.id === id); if (!p) return;
      p.likes = (p.likes || []).filter((n) => n !== name); if (on) p.likes.push(name);
    }),
    onFlights(cb) { subs.flights.push(cb); emitF(); },
    saveFlights: (data) => { ls.set("jeju.flights", data); emitF(); return Promise.resolve(); },
  };
}

/* ───────── 지도 (카카오맵) ───────── */
let map = null, kPlaces = null, geocoder = null, infoOverlay = null, tempOverlay = null;
const markers = new Map();
const LL = (lat, lng) => new kakao.maps.LatLng(lat, lng);
const kakaoLink = (p) => p.kakaoUrl || `https://map.kakao.com/link/search/${encodeURIComponent(p.name)}`;

function showMapMsg(title, body) {
  $("map").innerHTML = `<div class="map-msg"><div><b>${esc(title)}</b>${esc(body)}</div></div>`;
}
function loadKakao() {
  const key = (window.KAKAO_JS_KEY || "").trim();
  if (!key) return showMapMsg("카카오맵 키가 아직 없어요", "kakao-config.js에 JavaScript 키를 넣어주세요.");
  const s = document.createElement("script");
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&libraries=services&autoload=false`;
  s.onload = () => { try { kakao.maps.load(initMap); } catch (e) { mapFail(e); } };
  s.onerror = mapFail;
  document.head.appendChild(s);
}
function mapFail(e) {
  console.error(e);
  showMapMsg("카카오맵을 불러오지 못했어요", "키가 맞는지, 카카오 개발자 사이트에 이 사이트 주소를 등록했는지 확인해 주세요.");
}
function initMap() {
  const narrow = innerWidth < 600;
  map = new kakao.maps.Map($("map"), { center: LL(...JEJU.center), level: narrow ? 11 : 10 });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  kPlaces = new kakao.maps.services.Places();
  geocoder = new kakao.maps.services.Geocoder();
  kakao.maps.event.addListener(map, "click", (e) => {
    if (!$("sheet").hidden) setDraftLoc(e.latLng.getLat(), e.latLng.getLng(), "", "", true);
    else closeInfo();
  });
  renderMarkers();
}
function relayout() { if (map) map.relayout(); }

function popupHtml(p) {
  const link = safeUrl(p.link);
  return `<div class="pop"><strong>${esc(p.name)}</strong>
    <span class="meta">${CATS[p.cat].label} · ${esc(p.by)} 등록 · 가고 싶어요 ${(p.likes || []).length}</span>
    ${p.memo ? `<p>${esc(p.memo)}</p>` : ""}
    <div class="links">
      <a href="${esc(kakaoLink(p))}" target="_blank" rel="noopener">카카오맵</a>
      <a href="https://map.naver.com/p/search/${encodeURIComponent(p.name)}" target="_blank" rel="noopener">네이버지도</a>
      ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">참고 링크</a>` : ""}
    </div></div>`;
}
function closeInfo() { if (infoOverlay) { infoOverlay.setMap(null); infoOverlay = null; } }
function openInfo(p) {
  closeInfo();
  const wrap = document.createElement("div");
  wrap.className = "info-wrap";
  wrap.innerHTML = `<div class="info">${popupHtml(p)}<button type="button" class="info-x" aria-label="닫기">×</button></div>`;
  wrap.querySelector(".info-x").onclick = closeInfo;
  infoOverlay = new kakao.maps.CustomOverlay({ position: LL(p.lat, p.lng), content: wrap, yAnchor: 1, clickable: true, zIndex: 50 });
  infoOverlay.setMap(map);
}
function pinEl(p, sel) {
  const el = document.createElement("button");
  el.type = "button";
  el.className = `pin c-${p.cat}${sel ? " sel" : ""}`;
  el.setAttribute("aria-label", p.name);
  el.innerHTML = `<span>${CATS[p.cat].short}</span>`;
  el.onclick = () => selectPlace(p.id, false);
  return el;
}
function renderMarkers() {
  if (!map) return;
  const visible = new Set(filtered().map((p) => p.id));
  for (const [id, o] of markers) if (!visible.has(id)) { o.setMap(null); markers.delete(id); }
  for (const p of state.places) {
    if (!visible.has(p.id)) continue;
    const sel = p.id === state.activeId;
    let o = markers.get(p.id);
    if (!o) {
      o = new kakao.maps.CustomOverlay({ position: LL(p.lat, p.lng), content: pinEl(p, sel), yAnchor: 1.2, clickable: true, zIndex: sel ? 10 : 1 });
      o.setMap(map);
      markers.set(p.id, o);
      continue;
    }
    o.setPosition(LL(p.lat, p.lng));
    o.setContent(pinEl(p, sel));
    o.setZIndex(sel ? 10 : 1);
  }
  if (infoOverlay) {
    const p = state.places.find((x) => x.id === state.activeId);
    if (p && visible.has(p.id)) openInfo(p); else closeInfo();
  }
}
function selectPlace(id, fly) {
  state.activeId = id;
  const p = state.places.find((x) => x.id === id);
  renderList(); renderMarkers();
  if (!p || !map) return;
  if (fly) {
    if (matchMedia("(max-width: 820px)").matches) scrollTo({ top: 0, behavior: "smooth" });
    if (map.getLevel() > 6) map.setLevel(6);
    map.panTo(LL(p.lat, p.lng));
  }
  openInfo(p);
  const li = document.querySelector(`.place[data-id="${CSS.escape(id)}"]`);
  if (li && !fly) li.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

  if (state.sort === "like") list = [...list].sort((a, b) => (b.likes || []).length - (a.likes || []).length || b.createdAt - a.createdAt);
  return list;
}

  const list = filtered();
  $("listCount").textContent = list.length ? `${list.length}곳` : "";
  if (!state.places.length) {
    $("list").innerHTML = `<li class="empty"><b>아직 등록된 장소가 없어요</b>가고 싶은 식당·카페·놀거리를<br>‘+ 장소 추가’로 처음 올려주세요.</li>`;

    const likes = p.likes || [];

    const mine = state.me && p.by === state.me;

        ${p.addr ? `<span class="addr">${esc(p.addr)}</span>` : ""}

        <span>${esc(p.by)}</span>

      </div>

}
$("list").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.closest(".place").dataset.id;
  const p = state.places.find((x) => x.id === id); if (!p) return;
  const act = b.dataset.act;
  if (act === "go") selectPlace(id, true);
  if (act === "like") {
    if (!state.me) return openWho();
    Store.toggleLike(id, state.me, !(p.likes || []).includes(state.me)).catch(fail);
  }
  if (act === "edit") openSheet(p);
  if (act === "del") {
    if (!confirm(`‘${p.name}’을(를) 삭제할까요?`)) return;
    Store.deletePlace(id).then(() => toast("삭제했어요")).catch(fail);
  }
});

/* ───────── 등록/수정 폼 ───────── */
function locText() {
  const d = state.draftLoc;
  return d.addr ? `📍 ${d.addr}` : `📍 지도에서 찍은 위치 (${d.lat.toFixed(5)}, ${d.lng.toFixed(5)})`;
}
function setDraftLoc(lat, lng, addr, url, lookup) {
  state.draftLoc = { lat, lng, addr: addr || "", url: url || "" };
  if (map) {
    if (!tempOverlay) {
      const el = document.createElement("div");
      el.className = "pin temp";
      el.innerHTML = "<span>＋</span>";
      tempOverlay = new kakao.maps.CustomOverlay({ position: LL(lat, lng), content: el, yAnchor: 1.2, zIndex: 40 });
      tempOverlay.setMap(map);
    } else tempOverlay.setPosition(LL(lat, lng));
  }
  $("locBox").classList.add("set");
  $("locBox").textContent = locText();
  if (lookup && geocoder) {
    const mine = state.draftLoc;
    geocoder.coord2Address(lng, lat, (res, status) => {
      if (status !== kakao.maps.services.Status.OK || state.draftLoc !== mine || !res[0]) return;
      mine.addr = (res[0].road_address && res[0].road_address.address_name) || (res[0].address && res[0].address.address_name) || "";
      $("locBox").textContent = locText();
    });
  }
}
function openSheet(p) {
  if (!state.me) return openWho();
  closeInfo();
  state.editingId = p ? p.id : null;
  $("sheetTitle").textContent = p ? "장소 수정" : "장소 추가";
  $("sheetSave").textContent = p ? "저장" : "등록";
  $({ food: "catFood", cafe: "catCafe", fun: "catFun" }[p ? p.cat : (state.filter !== "all" ? state.filter : "food")]).checked = true;
  $("fName").value = p ? p.name : "";
  $("fMemo").value = p ? p.memo || "" : "";
  $("fLink").value = p ? p.link || "" : "";
  $("fSearch").value = ""; $("results").hidden = true; $("formErr").hidden = true;
  state.draftLoc = null; $("locBox").classList.remove("set"); $("locBox").textContent = "위치를 아직 정하지 않았어요";
  if (p) {
    setDraftLoc(p.lat, p.lng, p.addr, p.kakaoUrl, false);
    if (map) { if (map.getLevel() > 6) map.setLevel(6); map.setCenter(LL(p.lat, p.lng)); }
  }
  $("sheet").hidden = false; $("addBtn").hidden = true;
  if (map) map.setCursor("crosshair");
  if (matchMedia("(max-width: 820px)").matches) scrollTo({ top: 0, behavior: "smooth" });
  else $("fName").focus();
}
function closeSheet() {
  $("sheet").hidden = true; $("addBtn").hidden = false;
  if (map) map.setCursor("");
  if (tempOverlay) { tempOverlay.setMap(null); tempOverlay = null; }
  state.editingId = null; state.draftLoc = null;
}
$("addBtn").onclick = () => openSheet(null);
$("sheetClose").onclick = closeSheet;
$("sheetCancel").onclick = closeSheet;

function search() {
  const q = $("fSearch").value.trim() || $("fName").value.trim();
  if (!q) return;
  const r = $("results");
  const msg = (t) => { r.hidden = false; r.innerHTML = `<li><button type="button" disabled>${esc(t)}</button></li>`; };
  if (!kPlaces) return msg("지도가 아직 준비되지 않았어요. 잠시 후 다시 검색해 주세요.");
  msg("검색 중…");
  const bounds = new kakao.maps.LatLngBounds(LL(...JEJU.sw), LL(...JEJU.ne));
  kPlaces.keywordSearch(q, (data, status) => {
    const S = kakao.maps.services.Status;
    if (status === S.ZERO_RESULT) return msg("제주에서 찾은 결과가 없어요. 지도를 눌러 직접 찍어주세요.");
    if (status !== S.OK) return msg("검색에 실패했어요. 지도를 눌러 위치를 찍어주세요.");
    r.innerHTML = data.map((d, i) => {
      const kind = (d.category_name || "").split(">").pop().trim();
      const addr = d.road_address_name || d.address_name;
      return `<li><button type="button" data-i="${i}">${esc(d.place_name)}<small>${esc([kind, addr].filter(Boolean).join(" · "))}</small></button></li>`;
    }).join("");
    r.onclick = (e) => {
      const b = e.target.closest("button[data-i]"); if (!b) return;
      const d = data[+b.dataset.i];
      const lat = +d.y, lng = +d.x;
      setDraftLoc(lat, lng, d.road_address_name || d.address_name, d.place_url, false);
      if (!$("fName").value.trim() || !state.editingId) $("fName").value = d.place_name;
      const cat = KAKAO_CAT[d.category_group_code];
      if (cat) $({ food: "catFood", cafe: "catCafe", fun: "catFun" }[cat]).checked = true;
      if (map) { if (map.getLevel() > 5) map.setLevel(5); map.setCenter(LL(lat, lng)); }
      r.hidden = true;
    };
  }, { bounds, size: 8 });
}
$("searchBtn").onclick = search;
$("fSearch").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); search(); } });

$("sheet").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("fName").value.trim();
  const err = (m) => { $("formErr").textContent = m; $("formErr").hidden = false; };
  if (!name) return err("이름을 입력해 주세요.");
  if (!state.draftLoc) return err("위치를 검색하거나 지도를 눌러 정해 주세요.");
  const link = $("fLink").value.trim();
  if (link && !safeUrl(link)) return err("링크는 http:// 또는 https:// 로 시작해야 해요.");
  const data = {
    cat: document.querySelector('input[name="cat"]:checked').value,
    name, memo: $("fMemo").value.trim(), link,
    lat: state.draftLoc.lat, lng: state.draftLoc.lng, addr: state.draftLoc.addr || "", kakaoUrl: state.draftLoc.url || "",
  };
  const btn = $("sheetSave"); btn.disabled = true;
  const job = state.editingId ? Store.updatePlace(state.editingId, data) : Store.addPlace({ ...data, by: state.me });
  const wasEdit = !!state.editingId;
  job.then(() => { closeSheet(); toast(wasEdit ? "수정했어요" : `‘${name}’ 등록 완료`); })
     .catch(fail).finally(() => (btn.disabled = false));
});

/* ───────── 항공권 ───────── */
const WD = ["일","월","화","수","목","금","토"];
const parseD = (date, time) => date ? new Date(`${date}T${time || "00:00"}:00`) : null;
const fmtDate = (date) => { const d = parseD(date); return d ? `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})` : "날짜 미정"; };
function dday(date) {
  const d = parseD(date); if (!d) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const n = Math.round((d - t) / 86400000);
  return n > 0 ? `D-${n}` : n === 0 ? "D-DAY" : `여행 ${-n + 1}일째`;
}
function renderFlightChip() {
  const f = state.flights, o = f && f.out;
  if (!o || !o.date) { $("flightChip").textContent = "항공편 등록하기"; return; }
  const dd = dday(o.date);
  $("flightChip").innerHTML = `${esc(fmtDate(o.date))} ${esc(o.depTime || "")} 출발 <b>${esc(dd || "")}</b>`;
}
function passHtml(label, leg) {
  if (!leg || !leg.date) return `<article class="pass blank"><div class="pass-top"><span>${label}</span><b>미등록</b></div>
    <div class="pass-route"><div class="port"><span class="city">—</span></div><div class="plane">✈</div><div class="port to"><span class="city">—</span></div></div>
    <div class="pass-cut"></div><div class="pass-foot"><span>‘항공편 입력’을 눌러 등록해 주세요</span></div></article>`;
  return `<article class="pass">
    <div class="pass-top"><span>${label}</span><b>${esc(leg.airline || "")} ${esc(leg.no || "")}</b></div>
    <div class="pass-route">
      <div class="port"><span class="city">${esc(leg.from || "출발")}</span><time>${esc(leg.depTime || "--:--")}</time></div>
      <div class="plane" aria-hidden="true">✈</div>
      <div class="port to"><span class="city">${esc(leg.to || "도착")}</span><time>${esc(leg.arrTime || "--:--")}</time></div>
    </div>
    <div class="pass-cut"></div>
    <div class="pass-foot"><span>탑승일 <b>${esc(fmtDate(leg.date))}</b></span>${leg.terminal ? `<span>${esc(leg.terminal)}</span>` : ""}</div>
  </article>`;
}
function stayText(f) {
  const a = f && f.out && parseD(f.out.date, f.out.arrTime);
  const b = f && f.back && parseD(f.back.date, f.back.depTime);
  if (!a || !b || b <= a) return null;
  const h = Math.round((b - a) / 3600000);
  return `${Math.floor(h / 24)}일 ${h % 24}시간`;
}
let flightEditing = false;
function renderFlights() {
  const f = state.flights || {};
  renderFlightChip();
  if (flightEditing) return renderFlightForm(f);
  const stay = stayText(f), dd = f.out && dday(f.out.date);
  $("flights").innerHTML = `
    <div class="flights-head">
      <div><h2>항공권</h2><p>8명 모두 같은 항공편이에요.</p></div>
      <button class="btn primary" type="button" id="editFlights">${f.out ? "항공편 수정" : "항공편 입력"}</button>
    </div>
    ${(stay || dd) ? `<div class="stay">
      ${dd ? `<div><small>출발까지</small><b>${esc(dd)}</b></div>` : ""}
      ${stay ? `<div><small>제주 체류 (도착 → 귀가편 출발)</small><b>${esc(stay)}</b></div>` : ""}
    </div>` : ""}
    <div class="passes">${passHtml("가는 날", f.out)}${passHtml("오는 날", f.back)}</div>
    ${f.memo ? `<p class="ffoot" style="white-space:pre-wrap">${esc(f.memo)}</p>` : ""}
    ${f.updatedBy ? `<p class="ffoot">마지막 수정: ${esc(f.updatedBy)}</p>` : ""}`;
  $("editFlights").onclick = () => { if (!state.me) return openWho(); flightEditing = true; renderFlights(); };
}
function legFields(key, leg, title, defFrom, defTo) {
  leg = leg || {};
  const v = (k) => esc(leg[k] || "");
  return `<fieldset><legend>${title}</legend>
    <div class="field"><label for="${key}-date">날짜</label><input class="input" type="date" id="${key}-date" value="${v("date")}"></div>
    <div class="field"><label for="${key}-airline">항공사</label><input class="input" id="${key}-airline" value="${v("airline")}" placeholder="제주항공"></div>
    <div class="field"><label for="${key}-no">편명</label><input class="input" id="${key}-no" value="${v("no")}" placeholder="7C101"></div>
    <div class="field"><label for="${key}-from">출발 공항</label><input class="input" id="${key}-from" value="${v("from") || defFrom}"></div>
    <div class="field"><label for="${key}-depTime">출발 시각</label><input class="input" type="time" id="${key}-depTime" value="${v("depTime")}"></div>
    <div class="field"><label for="${key}-to">도착 공항</label><input class="input" id="${key}-to" value="${v("to") || defTo}"></div>
    <div class="field"><label for="${key}-arrTime">도착 시각</label><input class="input" type="time" id="${key}-arrTime" value="${v("arrTime")}"></div>
    <div class="field"><label for="${key}-terminal">터미널·집합 (선택)</label><input class="input" id="${key}-terminal" value="${v("terminal")}" placeholder="국내선 3번 게이트 앞"></div>
  </fieldset>`;
}
function renderFlightForm(f) {
  $("flights").innerHTML = `<div class="flights-head"><div><h2>항공편 입력</h2><p>입력하면 8명 모두에게 똑같이 보여요.</p></div></div>
    <form class="fform" id="fform">
      ${legFields("out", f.out, "가는 날", "김포", "제주")}
      ${legFields("back", f.back, "오는 날", "제주", "김포")}
      <div class="field"><label for="f-memo">메모 (선택)</label><textarea class="input" id="f-memo" placeholder="예: 출발 1시간 전 공항 집합, 수하물 15kg">${esc(f.memo || "")}</textarea></div>
      <div class="fform-foot"><button class="btn ghost" type="button" id="fcancel">취소</button><button class="btn primary" type="submit">저장</button></div>
    </form>`;
  $("fcancel").onclick = () => { flightEditing = false; renderFlights(); };
  $("fform").onsubmit = (e) => {
    e.preventDefault();
    const leg = (k) => Object.fromEntries(["date","airline","no","from","depTime","to","arrTime","terminal"].map((x) => [x, $(`${k}-${x}`).value.trim()]));
    const data = { out: leg("out"), back: leg("back"), memo: $("f-memo").value.trim(), updatedBy: state.me, updatedAt: Date.now() };
    Store.saveFlights(data).then(() => { flightEditing = false; toast("항공편을 저장했어요"); renderFlights(); }).catch(fail);
  };
}

/* ───────── 시작 ───────── */
function renderAll() { renderFilters(); renderList(); renderMarkers(); }
renderMe(); fitChrome(); renderAll(); renderFlights(); loadKakao();
if (!state.me) openWho();
const loadErr = (e) => { console.error(e); toast("데이터를 불러오지 못했어요. 새로고침해 주세요."); };
Store.onPlaces((list) => {
  state.places = list.filter((p) => CATS[p.cat] && isFinite(p.lat) && isFinite(p.lng));
  if (state.activeId && !state.places.some((p) => p.id === state.activeId)) state.activeId = null;
  renderAll();
}, loadErr);
Store.onFlights((f) => { state.flights = f; if (!flightEditing) renderFlights(); else renderFlightChip(); }, loadErr);
if (location.hash === "#flights") setTab("flights");
})();
</script>
</body>
</html>
